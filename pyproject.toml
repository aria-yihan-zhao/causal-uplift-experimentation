[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-uplift-experimentation"
version = "0.1.0"
description = "Experiment integrity, treatment-effect estimation, and uplift modeling on randomized campaign data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yihan Zhao"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=15,<24",
  "requests>=2.31,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
